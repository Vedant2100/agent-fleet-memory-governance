[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-mem-contextbench"
version = "0.1.0"
description = "Paired shared-memory governance experiments on SWE-ContextBench"
requires-python = ">=3.11"
dependencies = ["pyarrow==25.0.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
jev = ["typesafe-sdk==0.7.2"]
worker = ["mini-swe-agent==2.4.6", "litellm==1.102.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
